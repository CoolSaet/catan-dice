<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Catan Dice – Configuration</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; max-width: 520px; margin: 30px auto; padding: 0 16px; background: #f4f0e8; color: #333; }
  h1 { color: #b44; text-align: center; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .8em; font-weight: bold; }
  .badge.ap  { background: #f9a; color: #800; }
  .badge.sta { background: #9f9; color: #040; }
  fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 16px 0; padding: 12px 16px; background: #fff; }
  legend { font-weight: bold; padding: 0 6px; }
  label { display: block; margin: 10px 0 2px; font-size: .9em; color: #555; }
  input[type=text], input[type=password], input[type=url] {
    width: 100%; padding: 7px 10px; border: 1px solid #bbb; border-radius: 4px; font-size: 1em;
  }
  button { display: block; width: 100%; padding: 10px; margin-top: 14px; border: none; border-radius: 6px;
           font-size: 1em; cursor: pointer; }
  #saveBtn  { background: #b44; color: #fff; }
  #saveBtn:hover  { background: #933; }
  #rollBtn  { background: #4a4; color: #fff; margin-top: 20px; font-size: 1.1em; }
  #rollBtn:hover  { background: #282; }
  #msg { text-align: center; margin-top: 8px; font-size: .9em; color: #444; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Catan Dice</h1>
<p style="text-align:center">
  Current mode: <span id="modeLabel" class="badge">…</span>
</p>

<fieldset>
  <legend>AP (Access Point) Mode</legend>
  <label>SSID</label>
  <input type="text" id="apSsid" maxlength="31" placeholder="CatanDice"/>
  <label>Password</label>
  <input type="password" id="apPassword" maxlength="63" placeholder="(min 8 chars or blank for open)"/>
</fieldset>

<fieldset>
  <legend>WiFi (STA) Mode</legend>
  <p style="margin:4px 0 10px; color:#555; font-size:.9em;">
    The selected primary profile is tried first. If it fails, the other profile is tried. After which the device will fall back to ad-hoc AP mode.
  </p>

  <label style="margin-top:0">Primary profile to try first</label>
  <label style="display:flex; align-items:center; gap:8px; margin:6px 0 2px;">
    <input type="radio" name="staPrimary" value="1" checked />
    Local Catan WiFi
  </label>
  <label style="display:flex; align-items:center; gap:8px; margin:2px 0 10px;">
    <input type="radio" name="staPrimary" value="2" />
    Home WiFi
  </label>

  <label>Local Catan WiFi SSID</label>
  <input type="text" id="staLocalCatanSsid" maxlength="31" placeholder="HomeNetwork"/>
  <label>Local Catan WiFi Password</label>
  <input type="password" id="staLocalCatanPassword" maxlength="63"/>
  <label>Roll URL (used in STA mode)</label>
  <input type="url" id="urlLocalCatanSta" maxlength="255" placeholder="http://192.168.4.1/rollDice"/>

  <label>Home WiFi SSID</label>
  <input type="text" id="staHomeSsid" maxlength="31" placeholder="BackupNetwork"/>
  <label>Home WiFi Password</label>
  <input type="password" id="staHomePassword" maxlength="63"/>
  <label>Roll URL (used in STA mode)</label>
  <input type="url" id="urlHomeSta" maxlength="255" placeholder="http://catan.mydomain.eu/rollDice"/>

</fieldset>

<button id="saveBtn">💾 Save Configuration</button>
<div id="msg"></div>

<button id="rollBtn">🎲 Roll Dice Now!</button>

<script>
const $ = id => document.getElementById(id);
const fields = ['apSsid','apPassword','staLocalCatanSsid','staLocalCatanPassword','staHomeSsid','staHomePassword','urlLocalCatanSta','urlHomeSta'];

async function loadConfig() {
  try {
    const r = await fetch('/config');
    const d = await r.json();
    fields.forEach(k => { if (d[k] !== undefined) $(k).value = d[k]; });
    const primary = String(d.staPrimary || 1);
    const selected = document.querySelector(`input[name="staPrimary"][value="${primary}"]`);
    if (selected) selected.checked = true;
    const lbl = $('modeLabel');
    lbl.textContent = d.mode === 'ap' ? 'AP' : 'STA';
    lbl.className   = 'badge ' + (d.mode === 'ap' ? 'ap' : 'sta');
  } catch(e) { $('msg').textContent = 'Could not load config: ' + e; }
}

$('saveBtn').addEventListener('click', async () => {
  const payload = {};
  fields.forEach(k => payload[k] = $(k).value);
  const primary = document.querySelector('input[name="staPrimary"]:checked');
  payload.staPrimary = primary ? Number(primary.value) : 1;
  try {
    const r = await fetch('/config', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    $('msg').textContent = d.status === 'ok' ? '✅ Saved! Restart ESP to apply WiFi changes.' : '❌ Error saving.';
  } catch(e) { $('msg').textContent = '❌ ' + e; }
});

$('rollBtn').addEventListener('click', async () => {
  try {
    const r = await fetch('/roll', { method: 'POST' });
    const d = await r.json();
    $('msg').textContent = d.status === 'rolling' ? '🎲 Rolling!' : '❌ ' + JSON.stringify(d);
  } catch(e) { $('msg').textContent = '❌ ' + e; }
});

loadConfig();
</script>
</body>
</html>
